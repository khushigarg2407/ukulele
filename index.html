<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChordBook</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


    <!-- Header -->

    <header>

        <h1>🎸 ChordBook</h1>

    </header>



    <!-- Home -->

    <section id="homePage">


        <div class="searchBox">

            🔍

            <input 
                id="search"
                placeholder="Search songs..."
            >

        </div>



        <div id="songList"></div>


    </section>





    <!-- Song -->

    <section id="songPage" class="hidden">


        <button class="backBtn" onclick="goBack()">
            ←
        </button>



        <div class="songHeader">

            <h2 id="songTitle"></h2>

            <p id="songArtist"></p>


            <div class="chords" id="songChords"></div>


        </div>





        <!-- Scroll Control -->


        <div class="scrollControl">


            <button onclick="increaseSpeed()">
                ▲
            </button>


            <span id="scrollSpeed">
                1.0x
            </span>



            <button onclick="toggleScroll()" id="scrollButton">
                ▶
            </button>



            <button onclick="decreaseSpeed()">
                ▼
            </button>


        </div>





        <div id="lyrics"></div>


    </section>


</div>



<script src="app.js"></script>


</body>

</html>
